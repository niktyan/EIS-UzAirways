<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приложение для руководителя: анкета</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef3f9; --surface:#ffffff; --line:#d6dfeb; --line-2:#b4c0d2;
  --fg:#0e2242; --fg-2:#44546f; --fg-3:#6b7a93;
  --brand:#1b5fc4; --brand-2:#2f6fd6; --brand-soft:#e6eefb; --brand-ink:#12408a;
  --ok:#1a7f37; --ok-soft:#e6f4ea; --warn:#a85f00; --warn-soft:#fff4e0; --bad:#c62828; --bad-soft:#fdecec;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Manrope,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea{font:inherit}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(243,246,250,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 18px 10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--brand-ink);letter-spacing:.01em;white-space:nowrap}
.brand svg{flex:none}
.step{margin-left:auto;font-size:13px;color:var(--fg-3);white-space:nowrap}
.bar{height:4px;background:#e2e8f0}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .35s ease}
.save{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
@media (max-width:520px){.brand span{display:none}.step{display:none}}
.save.ok{color:var(--ok)}
.save.warn{color:var(--warn)}

.wrap{max-width:720px;margin:0 auto;padding:22px 18px 110px}
.view{display:none}
.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
h1{font-size:30px;line-height:1.15;letter-spacing:-.015em;margin:6px 0 12px;font-weight:800}
h2{font-size:25px;line-height:1.2;letter-spacing:-.01em;margin:6px 0 10px;font-weight:800}
h3{font-size:16px;margin:0 0 8px;font-weight:700}
p{margin:0 0 12px;color:var(--fg-2)}
p.lead{font-size:18px;color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card.soft{background:var(--brand-soft);border-color:#cfe0fa;box-shadow:none}
.propose h3{display:flex;align-items:center;gap:8px}
.propose ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.propose li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--fg)}
.propose li .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:9px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.propose li .tag{display:block;width:max-content;margin:4px 0 0 0}
.tag.now{background:var(--ok-soft);color:var(--ok)}
.tag.sys{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg-3);margin-top:12px;padding-top:10px;border-top:1px solid #cfe0fa}
.legend span{display:block;line-height:1.45}
.legend .tag{margin:0 6px 0 0}

/* sketch */
.sketch{margin:14px 0 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sketch svg{width:100%;max-width:420px;height:auto;display:block}
.sketch .cap{font-size:12.5px;color:var(--fg-3)}

/* questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;box-shadow:var(--shadow);margin:0 0 14px}
.q .qh{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .n{flex:none;font-size:12.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:2px 8px;line-height:1.5}
.q .t{font-weight:600;font-size:17px;line-height:1.35}
.q .hint{font-size:13px;color:var(--fg-3);margin:-4px 0 10px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-s);background:#fff;cursor:pointer;text-align:left;width:100%;min-height:48px;transition:border-color .15s,background .15s}
.opt:hover{border-color:#94a3b8}
.opt .box{flex:none;width:22px;height:22px;border:2px solid #94a3b8;border-radius:50%;display:grid;place-items:center;background:#fff;transition:all .15s}
.opt.multi .box{border-radius:6px}
.opt .box svg{opacity:0;transform:scale(.6);transition:all .15s}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .box{background:var(--brand);border-color:var(--brand)}
.opt.sel .box svg{opacity:1;transform:none}
.opt .lbl{flex:1;font-size:16px;line-height:1.3}
.opt.dis{opacity:.45;cursor:not-allowed}
.sub{margin:-2px 0 6px 34px}
.sub input{width:100%;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:8px;font-size:15px;outline:none}
.sub input:focus{border-color:var(--brand)}
.free textarea,.free input{width:100%;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-s);font-size:16px;outline:none;background:#fff}
.free textarea{min-height:88px;resize:vertical}
.free.own{margin-top:10px}
.free.own input{border-style:dashed;font-size:15px;padding:11px 14px}
.free.own input:focus{border-style:solid}
.free textarea:focus,.free input:focus{border-color:var(--brand)}
.q.done{border-color:#bcd0f0}
.q .ok-mark{margin-left:auto;font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--brand);color:#fff;flex:1}
.btn.main:hover{background:var(--brand-ink)}
.btn.sec{background:#fff;border:1.5px solid var(--line-2);color:var(--fg)}
.btn.ghost{background:transparent;color:var(--fg-3);font-weight:600;padding:12px 10px}
.btn.big{width:100%;font-size:17px;min-height:56px}
.skip{margin-top:4px;text-align:center}
.skip button{background:none;border:0;color:var(--fg-3);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}

/* start */
.hero{background:linear-gradient(160deg,#0b3a86 0%,#1757b8 55%,#2f6fd6 100%);color:#fff;border-radius:18px;padding:24px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{color:#fff;margin-top:8px}
.hero p{color:rgba(255,255,255,.85)}
.hero .eyebrow{color:#bcd6ff}
.hero svg.plane{position:absolute;right:-10px;top:-6px;opacity:.14;width:190px;height:190px}
.three{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.three div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.35}
.three b{display:block;font-size:18px;margin-bottom:2px}
.toc{display:flex;flex-direction:column;gap:6px}
.toc button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.toc button:hover{border-color:#94a3b8}
.toc .i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:13px;display:grid;place-items:center}
.toc .tt{flex:1;font-weight:600;font-size:15.5px}
.toc .st{font-size:12.5px;color:var(--fg-3);white-space:nowrap}
.toc .st.done{color:var(--ok);font-weight:700}
.toc .st.skip{color:var(--warn);font-weight:700}
.note{font-size:13.5px;color:var(--fg-3)}

/* final */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.sum b{display:block;font-size:26px;font-weight:800}
.sum span{font-size:12.5px;color:var(--fg-3)}
.ans{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;white-space:pre-wrap;max-height:260px;overflow:auto;color:var(--fg-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.secnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;color:var(--fg-3)}
.secnav a{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
@media (max-width:480px){h1{font-size:26px}h2{font-size:22px}}
.top{background:#0e2242;border-bottom:0;backdrop-filter:none}
.top .brand{color:#fff;text-decoration:none;font-size:14px}
.top .step{color:rgba(255,255,255,.75)}
.bar{background:rgba(255,255,255,.15)} .bar i{background:#6fb0ff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.chips button.cur{background:var(--brand);border-color:var(--brand);color:#fff}
.chips button.done:not(.cur){border-color:#9fd0ae;color:var(--ok)}
.chips button.skip:not(.cur){color:#a3aebf}
@media (max-width:520px){.top .brand span{display:inline}.step{display:block}}
.eyebrow{text-transform:none;letter-spacing:0;font-size:14px}
.hero{background:#0e2242}
.hero .eyebrow{color:#9fc4ff}
</style>
</head>
<body>

<div class="top">
  <div class="top-in"><a class="brand" href="./">Анкета по разделам</a><div class="step" id="stepLbl"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="chips" id="chips"></div>
</div>

<div class="wrap" id="app"><div class="card"><h2 style="font-size:22px">Страница загружается</h2><p style="margin:0">Если анкета не появилась через несколько секунд, откройте ссылку в браузере Safari или Chrome.</p></div></div>

<div class="nav" id="nav" hidden>
  <div class="nav-in">
    <button class="btn sec" id="btnBack">Назад</button>
    <button class="btn main" id="btnNext">Далее</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ========= DATA ========= */
const SECTIONS = [
 {id:'s1', title:'Главная страница', short:'Главная',
  intro:'Первый экран приложения. На нём главные цифры по всем направлениям и отдельный список того, что хуже нормы.',
  propose:[
   ['Список «Требует особого внимания»: всё, что хуже нормы','now'],
   ['Регулярность полётов','now'],['Безопасность: события, инциденты, серьёзные инциденты, расследования','now'],
   ['Аудиты: запланировано, выполнено, просрочено, не закрыто','now'],
   ['Мои поручения: всего, выполнено, не выполнено, просрочено','now'],
   ['Опасные факторы: всего, активные, ТОП по риску','now'],
   ['Показатели безопасности (SPI): сколько в норме из общего числа','now'],
   ['Парк сегодня: в полёте, на земле, на ТО, неисправны','sys'],
   ['Рейсы сегодня: выполнено, в полёте, задержаны, отменены','sys']],
  sketch:'home'},
 {id:'s2', title:'Рейсы и парк сегодня', short:'Рейсы',
  intro:'Рейсы текущего дня и состояние каждого борта. У задержанного рейса сразу написана причина.',
  propose:[['Список рейсов дня: номер, маршрут, борт, план и факт, статус, причина задержки словами','sys'],
   ['Состояние парка: каждый борт и его статус','sys'],['Положение бортов на карте','sys']],
  sketch:'flights'},

   ['Данные анализа полётной информации','sys']],
  sketch:'safety'},
 {id:'s5', title:'Аудиты', short:'Аудиты',
  intro:'План аудитов на год, несоответствия и сроки их закрытия.',
  propose:[['План аудитов и статусы','now'],['Несоответствия: ответственный, срок, статус','now'],['Отдельный список просроченных корректирующих мер','now']],
  sketch:'audits'},
 {id:'s6', title:'Поручения', short:'Поручения',
  intro:'Поручения от выдачи до приёмки: исполнитель, срок, результат, текущий статус.',

   ['Исполнитель сдаёт результат файлом, автор принимает или возвращает','now'],
   ['Перенос срока только по запросу с указанием причины','now'],['Статистика по дирекциям: в срок, просрочено','now']],

 {id:'s7', title:'Карта процессов', short:'Карта',

 {id:'s8', title:'Правда в цифрах', short:'Цифры',

  propose:[['Источник и время обновления под каждой цифрой','now'],['Ручной ввод помечен: кто и когда ввёл','now'],['История изменений не стирается','now']],

  sketch:'day'},
 {id:'s10', title:'Устройство и доступ', short:'Доступ',
  intro:'На каких устройствах и у кого будет доступ.',
  propose:null, sketch:null},
 {id:'s11', title:'Дальше', short:'Дальше',
  intro:'Что добавить позже и с чего начать.',
  propose:null, sketch:null},
];

/* q: {id, sec, t, type:'single'|'multi'|'number'|'text', opts, max, hint, optional}
   opt: string | {t, input} */
const Q = [
 {id:1, sec:'s1', t:'Какие блоки оставить на главной странице?', type:'multi',
  opts:['Требует особого внимания','Регулярность полётов','Безопасность полётов','Аудиты','Мои поручения','Опасные факторы','Показатели безопасности (SPI)','Парк сегодня','Рейсы сегодня']},
 {id:2, sec:'s1', t:'За какой период показывать цифры по умолчанию?', type:'single', opts:['Сегодня','7 дней','30 дней','С начала месяца']},

 {id:4, sec:'s2', t:'Где сегодня видно положение бортов в реальном времени?', type:'single',

 {id:5, sec:'s2', t:'Где фиксируются причины задержек?', type:'single',

 {id:7, sec:'s2', t:'Сколько воздушных судов в парке и каких типов?', type:'text', hint:'Например: 35 (A320neo, 787-8, A330)'},
 {id:8, sec:'s2', t:'Какие статусы борта нужны?', type:'multi', opts:['В полёте','На земле, готов','Плановое ТО','Неисправен (AOG)','Резерв']},

 {id:9, sec:'s3', t:'Как у вас считается регулярность?', type:'single',

 {id:10, sec:'s3', t:'Целевое значение регулярности утверждено?', type:'single', opts:[{t:'Да',input:'сколько %'},'Нет']},
 {id:11, sec:'s3', t:'В каких разрезах нужна регулярность?', type:'multi', opts:['По дням','По аэропортам','По направлениям','По типам ВС','По причинам']},
 {id:12, sec:'s3', t:'Какие группы причин показывать на графике?', type:'multi',
  opts:['Технические','Экипаж','Аэропорт и наземное обслуживание','УВД','Погода','Коммерческие','Поздний прилёт предыдущего рейса']},
 {id:13, sec:'s3', t:'Отмены и уходы на запасной считать отдельными показателями?', type:'single', opts:['Да, отдельно','Нет, внутри регулярности']},

/* ========= STATE ========= */
const LS_KEY='eis-survey-v1';
let state={answers:{}, skipped:[], rid:null, updatedAt:0};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(s&&s.answers) state=Object.assign(state,s);}catch(e){}
if(!state.rid){state.rid='r'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); persistLocal();}

function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}

/* db */
let writeOk=false;
function touched(){state.updatedAt=Date.now();persistLocal();}

/* ========= HELPERS ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const optT=o=>typeof o==='string'?o:o.t;
const optIn=o=>typeof o==='string'?null:o.input;
function isAnswered(q){
  const a=state.answers[q.id]; if(a==null) return false;
  const own=String(a.o||'').trim().length>0;
  if(q.type==='multi') return (Array.isArray(a.v)&&a.v.length>0)||own;
  if(q.type==='single') return !!a.v||own;
  return String(a.v||'').trim().length>0;
}
function progress(){
  const req=Q.filter(q=>!q.optional&&!state.skipped.includes(q.sec));
  const answered=req.filter(isAnswered).length;
  return {total:req.length,answered,pct:req.length?Math.round(answered/req.length*100):0};
}
function secStatus(sec){
  if(state.skipped.includes(sec.id)) return 'skip';
  const qs=Q.filter(q=>q.sec===sec.id&&!q.optional);
  const n=qs.filter(isAnswered).length;
  if(n===0) return 'none'; if(n===qs.length) return 'done'; return 'part';
}
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

function tile(x,y,w,h,t,v,unit,st,sub){
  const col=st==='ok'?C.ok:st==='warn'?C.warn:st==='bad'?C.bad:C.fg;
  const sc=st==='ok'?C.oks:st==='warn'?C.warns:st==='bad'?C.bads:'#eef2f7';
  const sl=st==='ok'?'норма':st==='warn'?'внимание':st==='bad'?'плохо':'';
  const narrow=w<150;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#fff" stroke="${C.line}"/>
  ${narrow&&st?`<rect x="${x}" y="${y+10}" width="4" height="${h-20}" rx="2" fill="${col}"/>`:''}
  <text x="${x+12}" y="${y+20}" font-size="11.5" font-weight="600" fill="${C.fg2}">${t}</text>
  ${sl&&!narrow?`<rect x="${x+w-62}" y="${y+9}" width="52" height="16" rx="8" fill="${sc}"/><text x="${x+w-36}" y="${y+20.5}" font-size="9.5" font-weight="700" fill="${col}" text-anchor="middle">${sl}</text>`:''}
  <text x="${x+12}" y="${y+50}" font-size="26" font-weight="800" fill="${col}">${v}<tspan font-size="13" font-weight="600" fill="${C.fg2}"> ${unit||''}</tspan></text>
  ${sub?`<text x="${x+12}" y="${y+h-11}" font-size="10.5" fill="${C.fg2}">${sub}</text>`:''}`;
}
function chip(x,y,txt,st){const col=st==='ok'?C.ok:st==='warn'?C.warn:st==='bad'?C.bad:C.fg2;const sc=st==='ok'?C.oks:st==='warn'?C.warns:st==='bad'?C.bads:'#eef2f7';const w=txt.length*6.3+16;

const app=$('#app'), nav=$('#nav'), btnBack=$('#btnBack'), btnNext=$('#btnNext');
const ORDER=['start',...SECTIONS.map(s=>s.id),'final'];
let view='start';

function render(){
  const i=ORDER.indexOf(view);
  const p=progress();
  $('#bar').style.width=p.pct+'%';
  $('#stepLbl').textContent=view==='start'?'':view==='final'?'Итог':`Раздел ${i} из ${SECTIONS.length}`;
  if(view==='start') app.innerHTML=renderStart();
  else if(view==='final') app.innerHTML=renderFinal();
  else app.innerHTML=renderSection(SECTIONS[i-1]);
  nav.hidden=(view==='start');
  const ch=document.getElementById('chips');ch.innerHTML=SECTIONS.map((sec,k)=>{const st=secStatus(sec);return `<button data-chip="${sec.id}" class="${sec.id===view?'cur ':''}${st}">${st==='done'?'✓ ':''}${k+1}. ${sec.short}</button>`}).join('')+`<button data-chip="final" class="${view==='final'?'cur':''}">Отправить</button>`;ch.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.chip));const cc=ch.querySelector('.cur');if(cc)cc.scrollIntoView({block:'nearest',inline:'center'});
  btnBack.style.visibility=i>1?'visible':'hidden';
  btnNext.textContent=view==='final'?'К началу':(i===ORDER.length-2?'Завершить':'Далее');
  window.scrollTo({top:0,behavior:'instant'});
  bind();
}

function renderStart(){
  const p=progress();
  return `
  <div class="hero">
    <div class="eyebrow">Подробная анкета, около 15 минут</div>
    <h1>Что должно быть в приложении для руководителя</h1>
    <p>Мы готовим приложение для руководителя. В нём будут показатели по направлениям компании, контроль поручений и план дня, всё на телефоне. Прежде чем рисовать экраны, нам нужно узнать, что у вас ведётся сейчас, где лежат данные и что должно быть на экране.</p>
    <div class="three"><div><b>Показатели</b><span>по направлениям компании, с отклонениями от нормы</span></div><div><b>Поручения</b><span>кому дано, срок, что сдано, принято или нет</span></div><div><b>План дня</b><span>встречи, дела, утренняя сводка</span></div></div>
  </div>

function nextUnfinished(){for(const s of SECTIONS){const st=secStatus(s);if(st==='none'||st==='part')return s.id}return 'final'}

function renderSection(sec){
  const k=SECTIONS.indexOf(sec);
  const qs=Q.filter(q=>q.sec===sec.id);
  const skipped=state.skipped.includes(sec.id);
  let h=`<div class="secnav"><span>Раздел ${k+1} из ${SECTIONS.length}</span><a data-go="start">Все разделы</a></div>
  <h2>${sec.title}</h2><p class="lead">${sec.intro}</p>`;
  if(sec.propose){
    h+=`<div class="card soft propose"><h3>Что мы предлагаем показать</h3><ul>${sec.propose.map(p=>`<li><span class="dot"></span><span>${p[0]}<span class="tag ${p[1]}">${p[1]==='now'?'можно сразу':'нужна система-источник'}</span></span></li>`).join('')}</ul>
    <div class="legend"><span><span class="tag now" style="margin:0">можно сразу</span> данные вводятся или уже есть в таблицах</span><span><span class="tag sys" style="margin:0">нужна система-источник</span> нужно подключить программу, где эти данные ведутся</span></div>
    ${sec.sketch?`<div class="sketch">${SK[sec.sketch]()}<div class="cap">Эскиз экрана. Цифры условные, для примера.</div></div>`:''}
    </div>`;
  }
  h+=`<h3 style="margin:18px 0 10px">Вопросы</h3>`;
  if(skipped) h+=`<div class="card" style="text-align:center"><p>Раздел пропущен.</p><button class="btn sec" data-unskip="${sec.id}">Всё же ответить</button></div>`;
  else{
    h+=qs.map(renderQ).join('');
    h+=`<div class="skip"><button data-skip="${sec.id}">Пропустить раздел: не моя область</button></div>`;
  }
  return h;
}
const CHECK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
function renderQ(q){
  const a=state.answers[q.id]||{};
  const done=isAnswered(q);
  let h=`<div class="q ${done?'done':''}" data-q="${q.id}"><div class="qh"><span class="n">${q.id}</span><span class="t">${q.t}</span>${done?'<span class="ok-mark">✓</span>':''}</div>`;
  if(q.hint) h+=`<div class="hint">${q.hint}</div>`;
  else if(q.type==='multi') h+=`<div class="hint">Можно выбрать несколько</div>`;
  if(q.type==='single'||q.type==='multi'){
    const sel=q.type==='multi'?(a.v||[]):(a.v?[a.v]:[]);
    h+=`<div class="opts">`+q.opts.map((o,idx)=>{
      const t=optT(o),inp=optIn(o);const on=sel.includes(t);
      let s=`<button class="opt ${q.type} ${on?'sel':''}" data-opt="${idx}"><span class="box">${CHECK}</span><span class="lbl">${esc(t)}</span></button>`;
      if(inp&&on) s+=`<div class="sub"><input type="text" placeholder="${esc(inp)}…" data-subin="${idx}" value="${esc((a.x||{})[t]||'')}"></div>`;
      return s;}).join('')+`</div><div class="free own"><input type="text" placeholder="Свой вариант или уточнение" data-own="1" value="${esc(a.o||'')}"></div>`;
  } else if(q.type==='number'){
    h+=`<div class="free"><input type="number" inputmode="numeric" min="0" placeholder="Число" data-free="1" value="${esc(a.v||'')}"></div>`;
  } else {
    h+=`<div class="free"><textarea placeholder="Ваш ответ" data-free="1">${esc(a.v||'')}</textarea></div>`;
  }
  return h+`</div>`;
}

function compactText(){
  const lines=['Ответы на опрос · '+new Date().toLocaleDateString('ru-RU')+' · '+state.rid];
  SECTIONS.forEach((sec,k)=>{
    if(state.skipped.includes(sec.id)){lines.push(`[${k+1}] ${sec.short}: пропущен`);return;}
    const qs=Q.filter(q=>q.sec===sec.id&&isAnswered(q)); if(!qs.length) return;
    lines.push(`[${k+1}] ${sec.short}`);
    qs.forEach(q=>lines.push(`${q.id}. ${answerStr(q)}`));
  });
  return lines.join('\n');
}
function answerStr(q){
  const a=state.answers[q.id]||{};let v='';
  if(q.type==='multi') v=(a.v||[]).map(t=>t+((a.x||{})[t]?` (${a.x[t]})`:'')).join('; ');
  else if(q.type==='single') v=a.v?a.v+((a.x||{})[a.v]?` (${a.x[a.v]})`:''):'';
  else v=String(a.v||'').trim();
  if(a.o&&String(a.o).trim()) v=(v?v+' · ':'')+'свой ответ: '+String(a.o).trim();
  return v||'—';
}
function tgParts(){
  const full=compactText(); const LIM=1800; const parts=[];
  if(full.length<=LIM) return [full];
  let cur='';
  full.split('\n').forEach(l=>{ if((cur+'\n'+l).length>LIM){parts.push(cur);cur=l} else cur=cur?cur+'\n'+l:l; });
  if(cur) parts.push(cur);
  return parts.map((p,i)=>`(часть ${i+1} из ${parts.length})\n`+p);
}
function renderFinal(){
  const p=progress();
  const txt=exportText();
  const parts=tgParts();
  const tgBtns=parts.map((t,i)=>`<a class="btn main big" href="https://t.me/share/url?url=${encodeURIComponent(location.href.split('#')[0])}&text=${encodeURIComponent(t)}" target="_blank" rel="noopener" style="text-decoration:none;margin-bottom:8px">Отправить в Telegram${parts.length>1?`, часть ${i+1} из ${parts.length}`:''}</a>`).join('');
  return `<div class="eyebrow">Итог</div><h2>${p.answered===p.total?'Спасибо, всё заполнено':'Почти готово'}</h2>
  <div class="sum"><div><b>${p.answered}</b><span>ответов из ${p.total}</span></div><div><b>${SECTIONS.filter(s=>secStatus(s)==='done').length}</b><span>разделов полностью</span></div><div><b>${state.skipped.length}</b><span>пропущено</span></div></div>
  ${p.answered<p.total?`<div class="card"><p style="margin:0">Остались вопросы без ответа. Это нормально, если они не по вашей части. <a data-go="${nextUnfinished()==='final'?'start':nextUnfinished()}" style="color:var(--brand);font-weight:600;cursor:pointer">Вернуться к незаполненному</a></p></div>`:''}
  <div class="card">
    <h3>Отправьте ответы</h3>
    <p>Кнопка откроет Telegram с готовым сообщением. Выберите того, кто прислал вам ссылку, и нажмите «Отправить».</p>
    ${tgBtns}
    <button class="btn sec big" id="copyBtn">Скопировать ответы</button>
    <p class="note" style="margin:10px 0 0">Если Telegram не открылся, скопируйте ответы и вставьте их в чат.</p>
  </div>
  <div class="card"><h3>Ваши ответы</h3><div class="ans" id="ansBox">${esc(txt)}</div></div>
  <div class="card"><h3>Что дальше</h3><p style="margin:0">По ответам мы составим техническое задание и нарисуем первый макет экранов, затем покажем его вам.</p></div>`;
}
function exportText(){
  const lines=['Опрос: приложение для руководителя','Респондент: '+state.rid,'Дата: '+new Date().toLocaleString('ru-RU'),''];
  SECTIONS.forEach((s,k)=>{
    lines.push(`[${k+1}] ${s.title}${state.skipped.includes(s.id)?' (пропущен)':''}`);
    Q.filter(q=>q.sec===s.id).forEach(q=>{
      const a=state.answers[q.id];let v='—';
      if(a){ if(q.type==='multi') v=(a.v||[]).map(t=>t+((a.x||{})[t]?` (${a.x[t]})`:'')).join('; ')||'—';
        else if(q.type==='single') v=a.v?a.v+((a.x||{})[a.v]?` (${a.x[a.v]})`:''):'—';
        else v=String(a.v||'').trim()||'—';
        if(a.o&&String(a.o).trim()) v=(v==='—'?'':v+' · ')+'свой ответ: '+String(a.o).trim(); }
      lines.push(`${q.id}. ${q.t} ${v}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

/* ========= EVENTS ========= */
function bind(){
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.go)}));
  app.querySelectorAll('[data-skip]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.skip;if(!state.skipped.includes(id))state.skipped.push(id);touched();go(nextAfter(id))}));
  app.querySelectorAll('[data-unskip]').forEach(b=>b.addEventListener('click',()=>{state.skipped=state.skipped.filter(x=>x!==b.dataset.unskip);touched();render()}));
  app.querySelectorAll('.q').forEach(qel=>{
    const q=Q.find(x=>x.id===+qel.dataset.q);
    qel.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{
      const t=optT(q.opts[+b.dataset.opt]);const a=state.answers[q.id]||(state.answers[q.id]={});
      if(q.type==='single'){a.v=(a.v===t?null:t)}
      else{a.v=a.v||[];const i=a.v.indexOf(t);if(i>=0)a.v.splice(i,1);else a.v.push(t)}
      touched();refreshQ(qel,q);
    }));
    qel.querySelectorAll('[data-subin]').forEach(inp=>inp.addEventListener('input',()=>{
      const t=optT(q.opts[+inp.dataset.subin]);const a=state.answers[q.id]||(state.answers[q.id]={});a.x=a.x||{};a.x[t]=inp.value;touched();
    }));
    qel.querySelectorAll('[data-own]').forEach(inp=>inp.addEventListener('input',()=>{
      const a=state.answers[q.id]||(state.answers[q.id]={});a.o=inp.value;touched();refreshQ(qel,q);
    }));
    qel.querySelectorAll('[data-free]').forEach(inp=>inp.addEventListener('input',()=>{
      const a=state.answers[q.id]||(state.answers[q.id]={});a.v=inp.value;touched();
      qel.classList.toggle('done',isAnswered(q));const m=qel.querySelector('.ok-mark');if(isAnswered(q)&&!m){qel.querySelector('.qh').insertAdjacentHTML('beforeend','<span class="ok-mark">✓</span>')}else if(!isAnswered(q)&&m)m.remove();
      $('#bar').style.width=progress().pct+'%';
    }));
  });
  const cb=$('#copyBtn'); if(cb) cb.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(compactText());toast('Скопировано. Вставьте в Telegram')}catch(e){const box=$('#ansBox');if(box){const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}toast('Текст выделен ниже, скопируйте его вручную')}});
}
function refreshQ(qel,q){
  const a=state.answers[q.id]||{};
  const sel=q.type==='multi'?(a.v||[]):(a.v?[a.v]:[]);
  qel.querySelectorAll('[data-opt]').forEach(b=>{
    const idx=+b.dataset.opt,o=q.opts[idx],t=optT(o),inp=optIn(o),on=sel.includes(t);
    b.classList.toggle('sel',on);
    let sub=b.nextElementSibling&&b.nextElementSibling.classList.contains('sub')?b.nextElementSibling:null;
    if(inp&&on&&!sub){
      b.insertAdjacentHTML('afterend',`<div class="sub"><input type="text" placeholder="${esc(inp)}…" data-subin="${idx}" value="${esc((a.x||{})[t]||'')}"></div>`);
      const ni=b.nextElementSibling.querySelector('input');
      ni.addEventListener('input',()=>{const aa=state.answers[q.id]||(state.answers[q.id]={});aa.x=aa.x||{};aa.x[t]=ni.value;touched();});
      ni.focus();
    } else if(sub&&!(inp&&on)) sub.remove();
  });
  const done=isAnswered(q);
  qel.classList.toggle('done',done);
  const m=qel.querySelector('.ok-mark');
  if(done&&!m) qel.querySelector('.qh').insertAdjacentHTML('beforeend','<span class="ok-mark">✓</span>');
  else if(!done&&m) m.remove();
  $('#bar').style.width=progress().pct+'%';
}
function nextAfter(id){const i=ORDER.indexOf(id);return ORDER[Math.min(i+1,ORDER.length-1)]}
function go(v){if(!ORDER.includes(v))v='start';view=v;try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch(e){}render()}
btnNext.addEventListener('click',()=>{if(view==='final')go('start');else go(nextAfter(view))});
btnBack.addEventListener('click',()=>{const i=ORDER.indexOf(view);go(ORDER[Math.max(i-1,0)])});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ORDER.includes(h)&&h!==view){view=h;render()}});

const h0=location.hash.slice(1);
view=ORDER.includes(h0)?h0:'start';
render();
})();
</script>
</body>
