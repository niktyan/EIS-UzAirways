<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите экран руководителя</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#0e2242; --ink-2:#44546f; --ink-3:#6b7a93;
  --sky:#1b5fc4; --sky-deep:#12408a; --sky-soft:#e6eefb;
  --cloud:#eef3f9; --white:#fff; --line:#d6dfeb;
  --ok:#1b7f3b; --ok-soft:#e3f3e8; --warn:#b86a00; --warn-soft:#fdf1dc; --bad:#c4302b; --bad-soft:#fbe6e5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cloud);color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}

/* top */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.top-in .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-in .cnt{opacity:.75;white-space:nowrap}
.prog{height:4px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;width:0;background:#6fb0ff;transition:width .3s}

.page{max-width:1040px;margin:0 auto;padding:0 16px 120px}

/* intro */
.intro{padding:28px 0 8px}
.intro h1{font-size:34px;line-height:1.08;letter-spacing:-.02em;font-weight:800;margin:0 0 12px}
.intro p{margin:0 0 12px;color:var(--ink-2);max-width:34em}
.intro .how{display:flex;flex-direction:column;gap:8px;margin:18px 0 22px;padding:0;list-style:none}
.intro .how li{display:flex;gap:12px;align-items:flex-start}
.intro .how b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:14px}
.btn{border:0;border-radius:14px;padding:15px 20px;font-weight:700;font-size:17px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.main{background:var(--sky);color:#fff}
.btn.main:active{background:var(--sky-deep)}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.note{font-size:14px;color:var(--ink-3)}

/* builder layout */
.build{display:block}
.pv-wrap{position:sticky;top:46px;z-index:10;background:var(--cloud);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.pv-cap{font-size:12.5px;color:var(--ink-3);margin:0 0 6px;display:flex;justify-content:space-between}
.pv{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(14,34,66,.45)}
.pv-head{background:var(--sky);color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700}
.pv-head span{font-weight:500;font-size:11.5px;opacity:.85}
.pv-body{padding:8px;max-height:38vh;overflow:auto}
.pv-wrap.static{position:static}
.pv-wrap.static .pv-body{max-height:none}
.qa{padding-top:14px}
.qa h2{font-size:23px;line-height:1.2;letter-spacing:-.01em;font-weight:800;margin:0 0 6px}
.qa .sub{color:var(--ink-2);margin:0 0 14px;font-size:15.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:50px;transition:border-color .12s,background .12s}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid #9aa8bd;border-radius:50%;display:grid;place-items:center;background:#fff}
.opt.multi .mark{border-radius:6px}
.opt .mark svg{opacity:0}
.opt.on{border-color:var(--sky);background:var(--sky-soft)}
.opt.on .mark{background:var(--sky);border-color:var(--sky)}
.opt.on .mark svg{opacity:1}
.opt .tx{flex:1;font-size:16px;line-height:1.3;font-weight:500}
.opt .tx small{display:block;font-size:13px;color:var(--ink-3);font-weight:400;margin-top:2px}
.own{margin-top:10px}
.own input,.field input,.field textarea{width:100%;background:#fff;border:1.5px dashed #b4c0d2;border-radius:12px;padding:12px 14px;font-size:15.5px;outline:none}
.own input:focus,.field input:focus,.field textarea:focus{border-style:solid;border-color:var(--sky)}
.field{margin:0 0 14px}
.field label{display:block;font-weight:700;font-size:15.5px;margin-bottom:6px}
.field textarea{min-height:80px;resize:vertical}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:1040px;margin:0 auto;display:flex;gap:10px}
.nav .btn.main{flex:1}

/* preview pieces */
.attn{border:1px solid #f0c4c2;background:#fff8f7;border-radius:10px;padding:6px 9px;margin-bottom:7px}
.attn h4{margin:0 0 3px;font-size:11px;font-weight:800;color:var(--bad)}
.attn div{font-size:11.5px;line-height:1.35;display:flex;gap:6px;align-items:baseline}
.attn i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--bad);transform:translateY(-1px)}
.attn i.w{background:var(--warn)}
.attn .more{color:var(--ink-3);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:1px solid var(--line);border-radius:10px;padding:6px 8px 7px;min-width:0;background:#fff;position:relative}
.tile .t{font-size:10.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;line-height:1.15;font-weight:700}
.tile .u{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.ok .v{color:var(--ok)} .tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)}
.tile.ok,.tile.warn,.tile.bad{border-left-width:4px}
.tile.ok{border-left-color:var(--ok)} .tile.warn{border-left-color:var(--warn)} .tile.bad{border-left-color:var(--bad)}
.tile svg.sp{display:block;width:100%;height:18px;margin-top:2px}
.pop{animation:pop .28s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.prog i{transition:none}}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line)}
.tbl td:nth-child(2){text-align:right;font-weight:700;white-space:nowrap}
.tbl td:nth-child(3){text-align:right;white-space:nowrap;font-size:11px;font-weight:700}
.empty{padding:22px 10px;text-align:center;color:var(--ink-3);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.n{background:#edf1f6;color:var(--ink-2)}
.ord{font-size:12.5px}
.ord .hd{font-size:11px;color:var(--ink-3);margin-bottom:2px}
.ord .nm{font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:4px}
.route{position:relative;height:30px;margin:6px 8px 2px}
.route::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:var(--line);border-radius:2px}
.route::after{content:"";position:absolute;left:0;width:62%;top:8px;height:3px;background:var(--sky);border-radius:2px}
.route b{position:absolute;top:2px;width:15px;height:15px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--sky)}
.route b.a{left:-4px} .route b.c{left:calc(62% - 7px)} .route b.z{right:-4px;background:#fff;box-shadow:0 0 0 1.5px var(--ink-3)}
.route-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-bottom:6px}
.route-l span:nth-child(2){color:var(--sky);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.pbtn{flex:1;text-align:center;border-radius:9px;padding:7px 6px;font-size:12px;font-weight:700}
.pbtn.g{background:var(--ok);color:#fff} .pbtn.o{border:1.5px solid var(--line)}
.logl{font-size:11.5px;color:var(--ink-2);padding:4px 0;border-top:1px dashed var(--line);margin-top:5px}
.bars div{display:grid;grid-template-columns:146px 1fr 40px;gap:6px;align-items:center;font-size:11.5px;margin-top:4px}
.bars span.b{height:9px;border-radius:5px;background:#e3e9f1;position:relative;overflow:hidden}
.bars span.b i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bars em{font-style:normal;font-weight:700;text-align:right}
.lock{background:linear-gradient(170deg,#12408a,#0e2242);color:#fff;border-radius:12px;padding:14px 12px;text-align:center}
.lock .clock{font-size:34px;line-height:1}
.lock .d{font-size:12px;opacity:.8;margin-bottom:10px}
.push{background:rgba(255,255,255,.94);color:var(--ink);border-radius:12px;padding:8px 10px;text-align:left;font-size:12px;line-height:1.35}
.push b{display:block;font-size:12px}
.devs{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin:4px 0 8px}
.dev{border:2px solid #b4c0d2;border-radius:8px;color:#9aa8bd;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:#fff}
.dev.on{border-color:var(--sky);color:var(--sky);background:var(--sky-soft)}
.dev.ph{width:46px;height:70px;font-size:9.5px} .dev.pad{width:80px;height:60px} .dev.pc{width:104px;height:64px;border-bottom-width:8px}
.roles div{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 2px;border-top:1px solid var(--line)}
.roles div.off{color:#a3aebf}
.stages{display:flex;flex-direction:column;gap:6px}
.stage{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;color:var(--ink-3)}
.stage.on{border-color:var(--sky);background:var(--sky-soft);color:var(--ink);font-weight:700}

/* result */
.res h2{font-size:28px;line-height:1.12;letter-spacing:-.02em;font-weight:800;margin:22px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:800}
.sumlist{margin:0;padding:0;list-style:none;font-size:14.5px}
.sumlist li{padding:7px 0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.sumlist li:first-child{border-top:0}
.sumlist span{color:var(--ink-3);font-size:13px}
.areas{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.dq{margin-bottom:16px}
.dq h4{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.3}

@media (min-width:900px){
  .build{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;align-items:start;padding-top:24px}
  .pv-wrap{order:2;top:70px;margin:0;padding:0;background:none}
  .pv{border-radius:34px;border:10px solid var(--ink);box-shadow:0 30px 60px -30px rgba(14,34,66,.6)}
  .pv-body{max-height:none;min-height:420px;padding:12px}
  .qa{padding-top:0}
  .qa h2{font-size:28px}
  .intro h1{font-size:46px}
  .tile .v{font-size:22px}
}
</style>
</head>
<body>
<div class="top"><div class="top-in"><span class="ttl">Соберите экран руководителя</span><span class="cnt" id="cnt"></span></div><div class="prog"><i id="prog"></i></div></div>
<div class="page" id="app">
  <div class="intro"><h1>Соберите экран руководителя</h1><p>Страница загружается. Если она не появилась через несколько секунд, откройте ссылку в браузере Safari или Chrome.</p></div>
</div>
<div class="nav" id="nav" hidden><div class="nav-in"><button class="btn sec" id="back">Назад</button><button class="btn main" id="next">Далее</button></div></div>
<div class="toast" id="toast"></div>

/* ---------- события ---------- */
function bind(){
 app.querySelectorAll('[data-act]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();act(b.dataset.act)})});
 app.querySelectorAll('[data-goto]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();idx=+b.dataset.goto;view='step';render()})});
 if(view==='step'){var st=STEPS[idx];
  app.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.k,v=val(st.id);
   if(st.type==='multi'){v=v.slice();var i=v.indexOf(k);if(i>=0)v.splice(i,1);else v.push(k);S.a[st.id]=v;b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'))}
   else{S.a[st.id]=k;app.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)})}
   save();pvUpdate(st.scene)})});
  var own=document.getElementById('own');own.addEventListener('input',function(){S.own[st.id]=own.value;save()})}
 if(view==='result')app.querySelectorAll('[data-area]').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.area,i=S.area.indexOf(k);if(i>=0)S.area.splice(i,1);else S.area.push(k);b.classList.toggle('on');save()})});
 if(view==='deep')app.querySelectorAll('.dq').forEach(function(q){var id=q.dataset.dq,multi=q.dataset.multi==='1';
  q.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){var d=S.deep[id]||(S.deep[id]={v:[]}),o=+b.dataset.o;d.v=d.v||[];
   if(multi){var i=d.v.indexOf(o);if(i>=0)d.v.splice(i,1);else d.v.push(o);b.classList.toggle('on')}
   else{var was=d.v[0]===o;d.v=was?[]:[o];q.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('on',x===b&&!was)})}
   save()})});
  var inp=q.querySelector('input');inp.addEventListener('input',function(){var d=S.deep[id]||(S.deep[id]={v:[]});d.o=inp.value;save()})});
 if(view==='send'){var nm=document.getElementById('nm'),cm=document.getElementById('cm');nm.addEventListener('input',function(){S.name=nm.value;save()});cm.addEventListener('input',function(){S.comment=cm.value;save()})}
}
function act(a){
 if(a==='begin'){var f=-1;for(var i=0;i<STEPS.length;i++){if(!S.seen[STEPS[i].id]){f=i;break}}if(f<0){view='result'}else{view='step';idx=f}lastTiles={};render()}
 else if(a==='reset'){S={a:{},own:{},seen:{},deep:{},area:[],name:'',comment:''};save();render()}
 else if(a==='afterres'){view=S.area.length?'deep':'send';render()}
 else if(a==='tosend'){view='send';render()}
 else if(a==='toresult'){view='result';render()}
 else if(a==='copy'){copy()}
 else if(a==='send'){var t=report();var url=TG_USER?'https://t.me/'+TG_USER+'?text='+encodeURIComponent(t):'https://t.me/share/url?url='+encodeURIComponent(location.href.split('#')[0])+'&text='+encodeURIComponent(t);
  try{navigator.clipboard.writeText(t)}catch(e){}
  window.open(url,'_blank')||(location.href=url)}
}
function copy(){var t=report();
 function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Скопировано. Вставьте в Telegram')}catch(e){toast('Не удалось скопировать')}ta.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Скопировано. Вставьте в Telegram')},fb);else fb()}
next.addEventListener('click',function(){var st=STEPS[idx];S.seen[st.id]=1;if(S.a[st.id]===undefined)S.a[st.id]=st.def;save();if(idx<STEPS.length-1){idx++;lastTiles=STEPS[idx].scene==='home'?lastTiles:{};render()}else{view='result';render()}});
back.addEventListener('click',function(){if(idx>0){idx--;render()}else{view='intro';render()}});
render();
})();
</script>
</body>
</html>
